name: Upstream Watch

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: factory-upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    outputs:
      auto_release: ${{ steps.summary.outputs.auto_release }}
      latest_version: ${{ steps.summary.outputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: patcher/package-lock.json
      - name: Install acceptance tools
        run: |
          sudo apt-get update
          sudo apt-get install -y 7zip
          npm ci --prefix patcher --ignore-scripts
      - name: Resolve accepted version
        id: accepted
        run: |
          accepted=$(node -p "require('./release/accepted-upstream.json').acceptedVersion")
          printf 'version=%s\n' "$accepted" >> "$GITHUB_OUTPUT"
      - name: Restore content-addressed DMG cache
        id: upstream-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/upstream-downloads
          key: factory-upstream-dmg-${{ runner.os }}-${{ steps.accepted.outputs.version }}-run-${{ github.run_id }}
          restore-keys: |
            factory-upstream-dmg-${{ runner.os }}-${{ steps.accepted.outputs.version }}-
      - name: Check and probe upstream
        id: probe
        continue-on-error: true
        run: |
          node scripts/upstream-watch.js \
            --accepted-version "${{ steps.accepted.outputs.version }}" \
            --probe \
            --cache-dir "$PWD/.cache/upstream-downloads" \
            --diagnostics-dir "$RUNNER_TEMP/factory-upstream-diagnostics" \
            --output "$RUNNER_TEMP/upstream-result.json"
      - name: Write summary contract
        id: summary
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/watch-summary.js \
            "$RUNNER_TEMP/upstream-result.json" \
            "$RUNNER_TEMP/upstream-summary" \
            "$RUN_URL"
          cat "$RUNNER_TEMP/upstream-summary/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Save newly downloaded content-addressed DMG
        if: always() && steps.summary.outputs.cache_save == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/upstream-downloads
          key: factory-upstream-dmg-${{ runner.os }}-${{ steps.accepted.outputs.version }}-${{ steps.summary.outputs.cache_suffix }}
      - name: Upload bounded patch diagnostics
        if: always() && steps.probe.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: upstream-patch-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/factory-upstream-diagnostics/
          if-no-files-found: ignore
          retention-days: 14
      - name: Create or update upstream issue
        if: always() && steps.summary.outputs.issue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title=$(cat "$RUNNER_TEMP/upstream-summary/issue-title.txt")
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/upstream-summary/issue-body.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/upstream-summary/issue-body.md"
          fi
      - name: Enforce fail-closed verdict
        if: always() && steps.probe.outcome == 'failure'
        run: exit 1

  auto-release:
    needs: watch
    if: needs.watch.outputs.auto_release == 'true'
    permissions:
      actions: write
      contents: read
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_VERSION: ${{ needs.watch.outputs.latest_version }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name' > "$RUNNER_TEMP/factory-release-tags.txt"
          node scripts/auto-release.js \
            --version "$FACTORY_VERSION" \
            --probe-status accepted \
            --tags-file "$RUNNER_TEMP/factory-release-tags.txt" \
            | tee "$RUNNER_TEMP/factory-release-plan.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce release plan
        env:
          PLAN_ACTION: ${{ steps.plan.outputs.action }}
        run: |
          case "$PLAN_ACTION" in
            dispatch|already-published) exit 0 ;;
            *) printf 'Automatic release plan is fail-closed: %s\n' "$PLAN_ACTION" >&2; exit 1 ;;
          esac
      - name: Dispatch accepted release workflow
        id: dispatch
        if: steps.plan.outputs.action == 'dispatch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_VERSION: ${{ steps.plan.outputs.factory_version }}
          WRAPPER_REVISION: ${{ steps.plan.outputs.wrapper_revision }}
        run: |
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f factory_version="$FACTORY_VERSION" \
            -f wrapper_revision="$WRAPPER_REVISION" \
            -f source_ref=main
          printf 'Automatic release dispatched for Factory %s (%s).\n' "$FACTORY_VERSION" "$WRAPPER_REVISION" >> "$GITHUB_STEP_SUMMARY"
      - name: Report dispatch failure
        if: steps.dispatch.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_VERSION: ${{ steps.plan.outputs.factory_version }}
        run: |
          title="[upstream-auto-release] Failed to dispatch Factory ${FACTORY_VERSION}"
          body=$(printf 'Automatic release dispatch failed for Factory %s.\n\nWorkflow: %s/%s/actions/runs/%s\n' "$FACTORY_VERSION" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
          exit 1
